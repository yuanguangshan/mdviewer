name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 零依赖：项目没有 package-lock，也不需要 npm install
      # 注意：这里传【目录】而不是带引号的 "tests/*.test.js"。
      # Node 20 不支持 --test 的 glob 展开（Node 22 才支持），引号形式在 CI 里会 ENOENT，
      # 这就是 2026-11-01 起 test 工作流一直红的原因（本地 Node 22 跑得通，所以没被发现）。
      - name: 单元测试（纯函数内核 / 安检规则 / Worker 集成）
        run: node --test tests/

      - name: 版本一致性 + SHELL 覆盖率
        run: node scripts/check-version.mjs

      - name: 语法检查
        run: |
          node --check app.js
          node --check sw.js
          node --check lib/md-core.js
          node --check lib/md-regex-worker.js
          node --check lib/fetch-guard.js
          node --check ops/serve-web.js
