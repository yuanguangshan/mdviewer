name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 零依赖：项目没有 package-lock，也不需要 npm install
      - name: 单元测试（md-core 纯函数）
        run: node --test "tests/*.test.js"

      - name: 版本一致性 + SHELL 覆盖率
        run: node scripts/check-version.mjs

      - name: 语法检查
        run: |
          node --check app.js
          node --check sw.js
          node --check lib/md-core.js
          node --check lib/md-regex-worker.js
