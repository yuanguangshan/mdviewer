name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 零依赖：项目没有 package-lock，也不需要 npm install
      # 用【裸】`node --test`（不带任何路径参数）：
      #   · 带引号的 "tests/*.test.js" 在 Node 20 里不会展开 glob → ENOENT
      #     （这就是 2026-11-01 起 test 工作流一直红的原因：本地 Node 22 能展开，CI 是 Node 20）
      #   · 传目录 `tests/` 在 Node 22 里又被当成模块路径 → MODULE_NOT_FOUND
      # 裸形式在 18/20/22 上行为一致：从 cwd 递归找 *.test.js，自动跳过 node_modules。
      - name: 单元测试（纯函数内核 / 安检规则 / Worker 集成）
        run: node --test

      - name: 版本一致性 + SHELL 覆盖率
        run: node scripts/check-version.mjs

      - name: 语法检查
        run: |
          node --check app.js
          node --check sw.js
          node --check lib/md-core.js
          node --check lib/md-regex-worker.js
          node --check lib/fetch-guard.js
          node --check ops/serve-web.js
