<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="雨轩编辑器">
  <title>雨轩编辑器</title>
  <defs>
    <!-- 底板：也跟着变彩 —— 深空底上铺一层低透明度多色光斑，斜向扫过 -->
    <linearGradient id="bgBase" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#141a2e"/>
      <stop offset="55%"  stop-color="#0e1220"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>
    <radialGradient id="bgCyan" cx="16%" cy="8%" r="62%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgMagenta" cx="88%" cy="14%" r="60%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity=".50"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgAmber" cx="78%" cy="94%" r="62%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgViolet" cx="8%" cy="90%" r="58%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- 彩虹圆环：整圈光谱，从 -90°（顶部）起顺时针 -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2dd4bf"/>
      <stop offset="22%"  stop-color="#22d3ee"/>
      <stop offset="46%"  stop-color="#3b82f6"/>
      <stop offset="70%"  stop-color="#8b5cf6"/>
      <stop offset="88%"  stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#d946ef"/>
      <stop offset="34%"  stop-color="#8b5cf6"/>
      <stop offset="66%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="18%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="ringGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#04060c" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 底板（彩色光斑铺在深空底上） -->
