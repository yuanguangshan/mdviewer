  <!-- ============ 彩虹圆环 + 深色芯 ============ -->
  <!-- 外发光：让环有霓虹感 -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="34"
          opacity=".55" filter="url(#ringGlow)"/>
  <!-- 主环：双渐变叠加做出整圈光谱（单 linearGradient 无法绕圈，用两层不同角度混合） -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="34"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring2)" stroke-width="34" opacity=".62"/>
  <!-- 环顶内高光 -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity=".30"
          stroke-width="6" stroke-dasharray="150 792" stroke-dashoffset="120" stroke-linecap="round"/>

  <!-- 深色芯：比底板更深，让 M 跳出来 -->
  <circle cx="256" cy="256" r="132" fill="#0b0f1c" filter="url(#coreShadow)"/>

  <!-- M：白→浅紫渐变，粗壮圆头；光学偏心（视觉重心补偿） -->
  <!-- 先画宽彩虹描边作为「彩色外圈」 -->
  <path d="M184 318 V206 L256 290 L328 206 V318"
        fill="none" stroke="url(#ring)" stroke-width="62"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 再画纯白 M 盖在中间，白得干净、缩小后仍是白色 -->
  <path d="M184 318 V206 L256 290 L328 206 V318"
        fill="none" stroke="#ffffff" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 光标点：用彩虹色，呼应品牌 -->
  <circle cx="330" cy="352" r="19" fill="url(#ring)"/>
</svg>
